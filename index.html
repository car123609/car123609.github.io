<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071921">
    <title>Tropical Sandbox — Loading</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="loading-screen" aria-live="polite">
        <div class="background" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <header class="server-summary">
            <div class="server-mark" aria-hidden="true">
                <span>TS</span>
            </div>

            <div class="server-copy">
                <p class="eyebrow">WELCOME TO</p>
                <h1 id="server-name">Tropical Sandbox</h1>
                <p id="server-tagline">Build freely. Explore together. Make something unforgettable.</p>
            </div>
        </header>

        <aside class="server-details" aria-label="Server details">
            <div class="detail">
                <span class="detail-label">MAP</span>
                <strong id="map-name">Loading…</strong>
            </div>
            <div class="detail">
                <span class="detail-label">GAMEMODE</span>
                <strong id="gamemode-name">Sandbox</strong>
            </div>
            <div class="detail">
                <span class="detail-label">SLOTS</span>
                <strong id="max-players">—</strong>
            </div>
        </aside>

        <section class="loading-panel">
            <div class="loading-panel__top">
                <div class="status-copy">
                    <div class="status-icon" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div>
                        <p class="status-label">JOINING SERVER</p>
                        <h2 id="loading-status">Connecting to Tropical Sandbox…</h2>
                    </div>
                </div>

                <div class="percentage" id="loading-percentage">—</div>
            </div>

            <div class="progress-track" id="progress-track" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-glow" aria-hidden="true"></div>
            </div>

            <div class="loading-panel__bottom">
                <p class="current-file" id="current-file">Preparing connection…</p>
                <p class="tip"><span>TIP</span> <span id="tip-text">Use the spawn menu to find props, tools, NPCs and more.</span></p>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="loading.js"></script>
</body>
</html>
